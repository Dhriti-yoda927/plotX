{% extends "layout.html" %}

{% block title %}
    Existing Graphs
{% endblock %}

{% block body %}

<style>
    .graph {
        transition: transform 0.2s ease;
    }

    .graph:hover {
        transform: scale(1.15);
        position: relative;
        z-index: 10;
    }
</style>

{% for graph in graphs %}
<form action="/generateGraph" method="POST">

    <input type="hidden" name="file_id" value="{{ graph[1] }}">
    <input type="hidden" name="graph_type" value="{{ graph[2] }}">

    <button type="submit" class="border-0 bg-transparent p-0">
        <img
            src="{{ url_for('graph', graph_name=graph[0]).removesuffix('.png') }}"
            class="graph img-fluid rounded shadow m-2"
        >
    </button>

</form>
{% endfor %}

{% endblock %}
