{% extends layout.html %}
{% block title %}
    History
{% endblock %}
{% block body %}
<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="text-center border rounded shadow p-5">
        <form action="#" method="POST">

            {% for file in files %}
                <button type = "submit"
                        name = "file"
                        value = "{{ file[0] }}"
                        class = "btn btn-primary m-2"
                        >
                    {{file[1]}}
                </button>
            {% endfor %}

        </form>
    </div>
</div>
{% endblock %}
